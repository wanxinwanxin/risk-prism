name: build-model

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      max_names:
        description: "Universe size cap"
        default: "3000"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Fetch previous build (capture-forward history)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --pattern riskprism-artifacts.tar.gz --dir prev 2>/dev/null; then
            mkdir -p artifacts_prev && tar xzf prev/riskprism-artifacts.tar.gz -C artifacts_prev
            echo "PRIOR_FLAG=--prior artifacts_prev" >> "$GITHUB_ENV"
            echo "prior build found; appending new weeks to its history"
          else
            echo "no prior release; cold build"
          fi
      - name: Build model
        env:
          # Define RISKPRISM_EDGAR_UA as a repo variable, e.g.
          # "riskprism weekly build (github.com/OWNER/REPO) you@example.com"
          # — SEC's fair-access policy requires a contact email.
          RISKPRISM_EDGAR_UA: ${{ vars.RISKPRISM_EDGAR_UA }}
        run: |
          riskprism-build --max-names "${{ github.event.inputs.max_names || '3000' }}" \
            $PRIOR_FLAG --out artifacts
      - name: Set release tag
        id: tag
        run: echo "tag=model-$(date +%F)" >> "$GITHUB_OUTPUT"
      - name: Publish artifacts as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf riskprism-artifacts.tar.gz -C artifacts .
          gh release create "${{ steps.tag.outputs.tag }}" riskprism-artifacts.tar.gz \
            --title "Model build ${{ steps.tag.outputs.tag }}" \
            --notes "Weekly PRISM-US-MH artifacts. See docs/METHODOLOGY.md. Not investment advice." \
            || gh release upload "${{ steps.tag.outputs.tag }}" riskprism-artifacts.tar.gz --clobber
      - name: Render explorer site
        run: |
          riskprism-site --artifacts artifacts --out site
      - name: Commit rendered site
        run: |
          git config user.name "riskprism-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/index.html site/model.md site/llms.txt
          git diff --cached --quiet || git commit -m "Weekly site render ${{ steps.tag.outputs.tag }}"
          git push
      - name: Redeploy Railway
        # Set the RAILWAY_TOKEN secret (a project token) to enable; skipped otherwise.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then echo "RAILWAY_TOKEN not set; skipping deploy"; exit 0; fi
          npx -y @railway/cli up --service risk-prism --detach
