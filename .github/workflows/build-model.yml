name: build-model

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      max_names:
        description: "Universe size cap"
        default: "1500"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build model
        env:
          # Define RISKPRISM_EDGAR_UA as a repo variable, e.g.
          # "riskprism weekly build (github.com/OWNER/REPO) you@example.com"
          # — SEC's fair-access policy requires a contact email.
          RISKPRISM_EDGAR_UA: ${{ vars.RISKPRISM_EDGAR_UA }}
        run: |
          riskprism-build --max-names "${{ github.event.inputs.max_names || '1500' }}" --out artifacts
      - name: Set release tag
        id: tag
        run: echo "tag=model-$(date +%F)" >> "$GITHUB_OUTPUT"
      - name: Publish artifacts as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf riskprism-artifacts.tar.gz -C artifacts .
          gh release create "${{ steps.tag.outputs.tag }}" riskprism-artifacts.tar.gz \
            --title "Model build ${{ steps.tag.outputs.tag }}" \
            --notes "Weekly PRISM-US-MH artifacts. See docs/METHODOLOGY.md. Not investment advice." \
            || gh release upload "${{ steps.tag.outputs.tag }}" riskprism-artifacts.tar.gz --clobber
      - name: Render explorer site
        run: |
          riskprism-site --artifacts artifacts --template site/template.html --out _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
