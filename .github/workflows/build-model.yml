name: build-model

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      max_names:
        description: "Universe size cap"
        default: "1500"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build model
        env:
          OSRISK_EDGAR_UA: "osrisk weekly build (github.com/${{ github.repository }})"
        run: |
          osrisk-build --max-names "${{ github.event.inputs.max_names || '1500' }}" --out artifacts
      - name: Set release tag
        id: tag
        run: echo "tag=model-$(date +%F)" >> "$GITHUB_OUTPUT"
      - name: Publish artifacts as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf osrisk-artifacts.tar.gz -C artifacts .
          gh release create "${{ steps.tag.outputs.tag }}" osrisk-artifacts.tar.gz \
            --title "Model build ${{ steps.tag.outputs.tag }}" \
            --notes "Weekly OSRM-US-MH artifacts. See docs/METHODOLOGY.md. Not investment advice." \
            || gh release upload "${{ steps.tag.outputs.tag }}" osrisk-artifacts.tar.gz --clobber
