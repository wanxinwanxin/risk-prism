name: deploy

# Keeps the Railway deployment current with main. The weekly build-model
# workflow deploys its own fresh render directly; this workflow covers every
# other change to the shipped surface (server code, site template, image
# definition). It re-renders the site from the latest release artifacts
# before packing, because site/history/ is gitignored but must ship.
#
# Pushes made by build-model's bot commit use GITHUB_TOKEN and therefore
# do not trigger this workflow — no double deploy on Mondays.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "site/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".railwayignore"
      - "README.md"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Fetch latest model artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve the newest model-* release explicitly: the repo's
          # "latest" release can be a package release (v* tag) with no
          # artifact assets (every deploy 2026-08-24 to 2026-09-11 failed
          # on that).
          tag=$(gh release list --limit 100 --json tagName \
                --jq '[.[].tagName | select(startswith("model-"))][0]')
          gh release download "$tag" --pattern riskprism-artifacts.tar.gz --dir dl
          mkdir -p artifacts && tar xzf dl/riskprism-artifacts.tar.gz -C artifacts
      - name: Render site from the current template
        run: riskprism-site --artifacts artifacts --out site
      - name: Deploy to Railway
        # RAILWAY_TOKEN is a Railway project token (repo secret).
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN not set — deploy skipped"
            exit 0
          fi
          npx -y @railway/cli up --service risk-prism --detach
