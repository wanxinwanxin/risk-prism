[project]
name = "riskprism"
version = "0.1.0"
description = "Open-source US equity factor risk model, built for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "riskprism contributors" }]
keywords = ["equity", "risk-model", "factor-model", "quant", "mcp", "agents"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "requests>=2.31",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]
dev = ["pytest>=8", "mcp>=1.2,<2"]

[project.scripts]
riskprism-build = "riskprism.build_cli:main"
riskprism-mcp = "riskprism.mcp_server:main"
riskprism-site = "riskprism.site_export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskprism"]

[tool.pytest.ini_options]
testpaths = ["tests"]
